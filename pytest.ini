[pytest]
minversion = 7.0
# Add project root to python path so tests can import from app/ and eval/
pythonpath = .

# Test discovery locations and patterns
testpaths = tests eval
python_files = test_*.py check_*.py
python_classes = Test*
python_functions = test_*

# CLI output formatting
addopts = 
    -ra
    -q
    --strict-markers
    --tb=short
    --disable-warnings

# Marker definitions to categorize CI tiers
markers =
    unit: Fast deterministic local unit tests (no API calls, $0 cost).
    integration: Tests validating external integrations and live LLM APIs.
    eval: Regression and benchmarking evaluation suite.
    slow: Tests running full datasets that take longer than 30s.

# Logging configuration during test runs
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(line)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S